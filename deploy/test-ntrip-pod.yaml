# Test Pod: Fake NTRIP Caster for generating test traffic
# This deploys the test_http_ntrip_caster.py script to simulate NTRIP/RTCM
# traffic within the cluster, allowing validation of Kyanos agent capture.
#
# Usage:
#   kubectl apply -f deploy/test-ntrip-pod.yaml
#   kubectl logs -f fake-ntrip-caster
#
# The caster listens on port 2101 (standard NTRIP port) and serves fake
# RTCM3 data to any connecting client.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-ntrip-caster-script
  namespace: default
data:
  test_http_ntrip_caster.py: |
    #!/usr/bin/env python3
    """Fake NTRIP Caster for testing Kyanos GNSS diagnostics.

    Serves a minimal NTRIP source table and streams fake RTCM3.2 frames to
    connected clients. Supports both HTTP/1.1 NTRIP v2 and legacy NTRIP v1.
    """

    import http.server
    import struct
    import time
    import threading
    import random
    import sys

    NTRIP_PORT = 2101
    MOUNTPOINT = "RTCM3"

    # RTCM3 frame structure: preamble (0xD3) + 6-bit reserved + 10-bit length + payload + 24-bit CRC
    RTCM3_PREAMBLE = 0xD3

    def make_rtcm3_frame(msg_type=1005, payload_data=None):
        """Generate a minimal RTCM3 frame with valid structure."""
        if payload_data is None:
            # Message 1005: Stationary RTK Reference Station ARP
            # Minimal 19-byte payload
            payload_data = struct.pack('>H', msg_type << 4) + bytes(17)

        length = len(payload_data)
        # Header: preamble + 6 reserved bits + 10-bit length
        header = struct.pack('>BH', RTCM3_PREAMBLE, length & 0x3FF)
        # CRC24Q placeholder (simplified — real CRC24Q omitted for test purposes)
        crc = struct.pack('>I', 0)[1:]  # 3 bytes
        return header + payload_data + crc

    class NTRIPHandler(http.server.BaseHTTPRequestHandler):
        """HTTP handler implementing NTRIP caster protocol."""

        def log_message(self, format, *args):
            sys.stderr.write(f"[NTRIP] {self.client_address[0]}:{self.client_address[1]} - {format % args}\n")

        def do_GET(self):
            if self.path == "/":
                # Source table response
                self._send_sourcetable()
            elif self.path == f"/{MOUNTPOINT}":
                # RTCM data stream
                self._send_rtcm_stream()
            else:
                self.send_error(404, "Mountpoint not found")

        def _send_sourcetable(self):
            """Send NTRIP source table."""
            table = (
                f"STR;{MOUNTPOINT};{MOUNTPOINT};RTCM 3.2;1005(1),1077(1),1087(1);"
                f"2;GPS+GLO;NONE;CHN;31.23;121.47;0;0;sNTRIP;none;B;N;0;\r\n"
                "ENDSOURCETABLE\r\n"
            )
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(table)))
            self.send_header("Server", "FakeNTRIPCaster/1.0")
            self.end_headers()
            self.wfile.write(table.encode())

        def _send_rtcm_stream(self):
            """Stream RTCM3 frames continuously."""
            # Check for NTRIP client headers
            ntrip_version = self.headers.get("Ntrip-Version", "Ntrip/1.0")
            self.log_message("Client connected: %s", ntrip_version)

            self.send_response(200)
            self.send_header("Content-Type", "application/octet-stream")
            self.send_header("Server", "FakeNTRIPCaster/1.0")
            self.send_header("Connection", "close")
            self.end_headers()

            try:
                msg_types = [1005, 1077, 1087, 1097, 1127]
                while True:
                    # Send a burst of RTCM messages (simulating 1Hz update rate)
                    for msg_type in msg_types:
                        # Variable payload to simulate realistic message sizes
                        payload_size = random.randint(20, 200)
                        payload = struct.pack('>H', msg_type << 4) + bytes(payload_size - 2)
                        frame = make_rtcm3_frame(msg_type, payload)
                        self.wfile.write(frame)

                    self.wfile.flush()
                    time.sleep(1.0)
            except (BrokenPipeError, ConnectionResetError):
                self.log_message("Client disconnected")

    def run_caster():
        """Start the fake NTRIP caster."""
        server = http.server.HTTPServer(("0.0.0.0", NTRIP_PORT), NTRIPHandler)
        print(f"Fake NTRIP Caster running on port {NTRIP_PORT}")
        print(f"  Source table: http://0.0.0.0:{NTRIP_PORT}/")
        print(f"  RTCM stream:  http://0.0.0.0:{NTRIP_PORT}/{MOUNTPOINT}")
        sys.stdout.flush()
        server.serve_forever()

    if __name__ == "__main__":
        run_caster()
---
apiVersion: v1
kind: Pod
metadata:
  name: fake-ntrip-caster
  namespace: default
  labels:
    app: fake-ntrip-caster
    kyanos.io/test: "true"
spec:
  containers:
    - name: caster
      image: python:3.11-slim
      command: ["python3", "/scripts/test_http_ntrip_caster.py"]
      ports:
        - name: ntrip
          containerPort: 2101
          protocol: TCP
      volumeMounts:
        - name: script
          mountPath: /scripts
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  volumes:
    - name: script
      configMap:
        name: fake-ntrip-caster-script
  restartPolicy: Always
---
# Service to make the caster discoverable within the cluster
apiVersion: v1
kind: Service
metadata:
  name: fake-ntrip-caster
  namespace: default
  labels:
    app: fake-ntrip-caster
spec:
  selector:
    app: fake-ntrip-caster
  ports:
    - name: ntrip
      port: 2101
      targetPort: 2101
      protocol: TCP
---
# Test client Pod that connects to the caster (generates traffic for Kyanos to capture)
apiVersion: v1
kind: Pod
metadata:
  name: ntrip-test-client
  namespace: default
  labels:
    app: ntrip-test-client
    kyanos.io/test: "true"
spec:
  containers:
    - name: client
      image: python:3.11-slim
      command:
        - python3
        - -c
        - |
          import urllib.request
          import time
          import sys

          CASTER_URL = "http://fake-ntrip-caster:2101/RTCM3"
          print(f"Connecting to {CASTER_URL}...")
          sys.stdout.flush()

          while True:
              try:
                  req = urllib.request.Request(CASTER_URL)
                  req.add_header("Ntrip-Version", "Ntrip/2.0")
                  req.add_header("User-Agent", "NTRIP KyanosTestClient/1.0")

                  with urllib.request.urlopen(req) as resp:
                      print(f"Connected! Status: {resp.status}")
                      sys.stdout.flush()
                      bytes_received = 0
                      while True:
                          data = resp.read(1024)
                          if not data:
                              break
                          bytes_received += len(data)
                          if bytes_received % 10240 < 1024:
                              print(f"  Received {bytes_received} bytes of RTCM data")
                              sys.stdout.flush()
              except Exception as e:
                  print(f"Connection error: {e}, retrying in 5s...")
                  sys.stdout.flush()
                  time.sleep(5)
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
  restartPolicy: Always
