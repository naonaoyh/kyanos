{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kyanos-agent.serviceAccountName" . }}
  namespace: {{ include "kyanos-agent.namespace" . }}
  labels:
    {{- include "kyanos-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kyanos-agent.fullname" . }}
  labels:
    {{- include "kyanos-agent.labels" . | nindent 4 }}
rules:
  # PodResolver: list and watch pods to resolve container IPs to pod names
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # PodResolver: list nodes for node metadata
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Optional: read services for service-level correlation
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Optional: read namespaces for namespace-level filtering
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kyanos-agent.fullname" . }}
  labels:
    {{- include "kyanos-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kyanos-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kyanos-agent.serviceAccountName" . }}
    namespace: {{ include "kyanos-agent.namespace" . }}
{{- end }}
