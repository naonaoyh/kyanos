# Default values for kyanos-console

image:
  registry: ccr.ccs.tencentyun.com
  repository: kyanos/kyanos-console
  tag: ""  # Defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

# gRPC server configuration (agents connect here)
grpc:
  port: 9090
  tls:
    enabled: false
    # Secret containing tls.crt and tls.key
    secretName: ""

# HTTP server configuration (web dashboard)
http:
  port: 8080

# Service configuration
service:
  type: ClusterIP
  grpcPort: 9090
  httpPort: 8080
  annotations: {}

# Ingress for web dashboard
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: console.kyanos.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resource requests and limits
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Storage for session data / diagnostics history
# NOTE: persistence 使用 ReadWriteOnce 访问模式时，replicaCount 应设为 1，
# 否则第二个副本将无法在非首个节点上挂载 PVC。如需多副本 + 持久化，
# 请使用 ReadWriteMany 存储类（如 CFS / NFS）。
persistence:
  enabled: false
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce

# Data retention in days (0 = disable automated deletion)
storageRetention: 7

# Additional environment variables
extraEnv: []

# Pod configuration
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Service account
serviceAccount:
  create: true
  name: "kyanos-console"
  annotations: {}
