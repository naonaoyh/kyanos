// Kyanos Agent <-> Control Plane (Console) gRPC contract.
//
// Phase 7 (agent-grpc-control-plane). This file is the single source of truth
// shared by the Agent and the Console (Requirement 9.5): both sides compile
// against the generated bindings. The Console implementation is out of scope
// for Phase 7; this contract defines only the wire shape.
//
// Credential-safety invariant: NTRIP passwords must never leave the Agent in
// any event payload. AuthEvent therefore has NO password field by
// construction; there is intentionally no field in this contract that carries
// a credential value.
//
// Generate Go bindings with:
//   protoc --go_out=. --go_opt=module=kyanos \
//          --go-grpc_out=. --go-grpc_opt=module=kyanos \
//          proto/agent.proto

syntax = "proto3";

package kyanos.agent.v1;

option go_package = "kyanos/proto/agentpb";

// AgentService is the control-plane API. The bidirectional control stream is
// realized as the Connect server stream (commands Console -> Agent) paired with
// the ReportEvents client stream (events Agent -> Console).
service AgentService {
  // Connect registers the Agent (AgentInfo) and returns the server stream of
  // control commands the Console sends to this Agent. (Req 2.1, 2.2, 2.3)
  rpc Connect(AgentInfo) returns (stream ControlCommand);

  // ReportEvents streams session diagnostic events from the Agent to the
  // Console. (Req 4.1)
  rpc ReportEvents(stream SessionEvent) returns (EventAck);

  // ReportStatus reports managed-pod set and health updates. (Req 2.4)
  rpc ReportStatus(AgentStatus) returns (StatusAck);

  // StartCapture explicitly dispatches a capture task. (Req 3.1)
  rpc StartCapture(CaptureTask) returns (TaskResponse);

  // StopCapture explicitly stops an in-progress capture task. (Req 3.6)
  rpc StopCapture(StopRequest) returns (TaskResponse);
}

// ---------------------------------------------------------------------------
// Registration & status
// ---------------------------------------------------------------------------

// AgentInfo is the registration handshake payload. The Agent is uniquely
// addressed by node_name. (Req 2.1, 2.6, 9.1)
message AgentInfo {
  string node_name = 1; // unique Agent address
  string agent_version = 2;
  repeated PodInfo managed_pods = 3;
}

// PodInfo is resolved Kubernetes Pod identity. (Req 6.6)
message PodInfo {
  string pod_name = 1;
  string pod_ip = 2;
  string namespace = 3;
  string node_name = 4;
  repeated string container_ids = 5;
  repeated uint64 cgroup_ids = 6;
}

// AgentStatus is a periodic / on-change health and managed-pod report.
// (Req 2.4, 7.5)
message AgentStatus {
  string node_name = 1;
  repeated PodInfo managed_pods = 2;
  uint64 discarded_events = 3;
}

// StatusAck acknowledges an AgentStatus report.
message StatusAck {
  bool ok = 1;
}

// EventAck acknowledges the events received on a ReportEvents stream.
message EventAck {
  uint64 received = 1;
}

// ---------------------------------------------------------------------------
// Control commands (Console -> Agent)
// ---------------------------------------------------------------------------

// ControlCommand is the single command channel carrying all command kinds via
// a oneof, so one stream satisfies Req 2.3.
message ControlCommand {
  oneof command {
    CaptureTask start_capture = 1;
    StopRequest stop_capture = 2;
    FilterUpdate update_filter = 3;
  }
}

// CaptureTask instructs the Agent to begin a targeted capture.
// (Req 3.1-3.5, 3.8)
message CaptureTask {
  string task_id = 1;
  string target_pod = 2;
  string target_namespace = 3;
  map<string, string> pod_labels = 4;
  NTRIPFilterConfig ntrip_filter = 10;
  RTCMFilterConfig rtcm_filter = 11;
  int64 duration_seconds = 20;
  ExportOptions export = 21;
}

// StopRequest instructs the Agent to stop an in-progress capture task.
// (Req 3.6-3.7)
message StopRequest {
  string task_id = 1;
}

// FilterUpdate modifies active filter rules at runtime. An empty task_id means
// the update applies globally. (Req 5.1-5.3)
message FilterUpdate {
  string task_id = 1; // empty => global
  repeated string add_pods = 2;
  repeated string remove_pods = 3;
  NTRIPFilterConfig ntrip_filter = 10;
  RTCMFilterConfig rtcm_filter = 11;
  int64 duration_seconds = 20; // optional task-param change
}

// TaskResponse reports the outcome of a CaptureTask or StopRequest.
// (Req 3.3-3.4, 3.6-3.7)
message TaskResponse {
  string task_id = 1;
  bool accepted = 2;
  string reason = 3; // populated on reject / not-found
  Status status = 4;
}

// Status is the outcome classification for a TaskResponse.
enum Status {
  STATUS_UNSPECIFIED = 0;
  ACCEPTED = 1;
  REJECTED = 2;
  STOPPED = 3;
  NOT_FOUND = 4;
}

// ---------------------------------------------------------------------------
// Filter & export configuration
// ---------------------------------------------------------------------------

// NTRIPFilterConfig maps onto the existing user-space NTRIP filter.
message NTRIPFilterConfig {
  repeated string mountpoints = 1;
  repeated string usernames = 2;
  repeated string versions = 3;
  bool errors_only = 4;
  bool gga_only = 5;
}

// RTCMFilterConfig maps onto the existing user-space RTCM filter.
message RTCMFilterConfig {
  repeated int32 message_types = 1;
  bool crc_errors_only = 2;
}

// ExportOptions selects task output formats / destinations. (Req 3.8)
message ExportOptions {
  bool export_pcap = 1;
  bool export_parsed = 2;
  string cos_bucket = 3;
}

// ---------------------------------------------------------------------------
// Session events (Agent -> Console)
// ---------------------------------------------------------------------------

// SessionEvent is one diagnostic event streamed to the Console.
// (Req 4.1-4.7, 9.2)
message SessionEvent {
  string task_id = 1;            // owning task (Req 3.9)
  string session_id = 2;         // Req 4.7
  int64 timestamp_ns = 3;        // Req 4.7
  PodInfo pod = 4;               // resolved identity (may be empty)
  ClientAddr observed_client = 5; // preserved verbatim (Req 9.2)
  oneof event {
    AuthEvent auth = 10;
    GgaEvent gga = 11;
    RtcmEvent rtcm = 12;
    NetworkEvent network = 13;
    SessionCloseEvent close = 14;
  }
}

// AuthEvent carries the authentication outcome. (Req 4.2)
// By construction this message has NO password field: the NTRIP credential is
// never projected onto the wire.
message AuthEvent {
  string method = 1; // basic_auth | source_method | none
  bool success = 2;
  int32 http_status = 3;
  string mountpoint = 4;
  string username = 5;
  int64 login_latency_ms = 6;
}

// GgaEvent carries GGA position attributes. (Req 4.3)
message GgaEvent {
  double latitude = 1;
  double longitude = 2;
  int32 fix_quality = 3;
  int32 num_satellites = 4;
  double hdop = 5;
  double diff_age = 6;
  string diff_station_id = 7;
}

// RtcmEvent carries RTCM frame attributes. (Req 4.4)
message RtcmEvent {
  int32 message_type = 1;
  int32 size = 2;
  bool crc_valid = 3;
  int64 interval_ms = 4;
}

// NetworkEvent carries network-quality attributes. (Req 4.5)
message NetworkEvent {
  int32 retransmissions = 1;
  double retransmission_rate = 2;
  int64 avg_rtt_us = 3;
  int64 p95_rtt_us = 4;
  int64 rtt_jitter_us = 5;
  int32 tcp_resets = 6;
}

// SessionCloseEvent carries the disconnect reason and a full session summary.
// The summary is always present, even when the session recorded no prior
// auth/GGA/RTCM/network events. (Req 4.6)
message SessionCloseEvent {
  string disconnect_reason = 1;
  string disconnect_detail = 2;
  SessionSummary summary = 3; // always present
}

// ClientAddr is the observed client address, preserved verbatim so Phase 10
// can recover the real client IP behind the Cloud Load Balancer. (Req 9.2)
message ClientAddr {
  string ip = 1;
  uint32 port = 2;
}

// SessionSummary is the self-contained, finalized view of a session, mirroring
// the existing session.SessionSummaryJSON structured feed. Like that feed, it
// intentionally carries NO credential field.
message SessionSummary {
  string session_id = 1;
  string mountpoint = 2;
  string username = 3;
  string ntrip_version = 4;

  string client_ip = 10;
  uint32 client_port = 11;
  string server_pod = 12;
  string server_ip = 13;

  int64 start_time_ns = 20;
  int64 close_time_ns = 21;
  int64 duration_ms = 22;

  // Login (S1)
  string auth_method = 30;
  bool auth_checked = 31;
  bool auth_success = 32;
  int32 http_status_code = 33;
  int64 login_latency_ms = 34;

  // GGA (S2)
  int32 gga_events = 40;
  double gga_fix_rate = 41;
  double gga_avg_satellites = 42;
  double gga_frequency_hz = 43;

  // RTCM (S3)
  int32 rtcm_frames = 50;
  int64 rtcm_bytes = 51;
  int32 rtcm_crc_errors = 52;
  double rtcm_crc_error_rate = 53;
  int64 rtcm_avg_interval_ms = 54;
  int64 rtcm_p95_interval_ms = 55;
  double rtcm_throughput_bps = 56;
  int32 rtcm_interruptions = 57;
  map<string, int32> rtcm_message_types = 58;

  // Network (S5)
  int32 retransmissions = 60;
  double retransmission_rate = 61;
  double avg_rtt_ms = 62;
  double p95_rtt_ms = 63;
  double rtt_jitter_ms = 64;
  int32 tcp_resets = 65;

  // Disconnect (S4)
  string disconnect_reason = 70;
  string disconnect_detail = 71;

  // Diagnostic score
  int32 score = 80;
  int32 login_score = 81;
  int32 gga_score = 82;
  int32 rtcm_score = 83;
  int32 network_score = 84;
  int32 stability_score = 85;

  repeated SessionIssue issues = 90;
}

// SessionIssue is the protobuf form of a diagnostic issue.
message SessionIssue {
  string category = 1;
  string severity = 2;
  string description = 3;
}
